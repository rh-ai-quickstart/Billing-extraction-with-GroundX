# Phase 1: Operators and cluster preparation
# Install this chart FIRST, then install billing-workloads after operators are ready.

# Node label applied to OpenShift workers for GroundX pod scheduling.
#
# NOTE: If layout inference will use a GPU, ensure the labeled nodes have
# an NVIDIA GPU available. GPU vs CPU-only resource requests for layout
# inference are configured in the billing-workloads chart under
# groundx.layout.inference.resources (see billing-workloads/values.yaml).
nodeLabel:
  key: node
  value: groundx-node

# Container image for the node-labeling hook Job
job:
  image: quay.io/openshift/origin-cli:latest

# ServiceAccount used by the node-labeling hook Job
serviceAccount:
  create: true
  name: ""
  clusterRole: cluster-admin

# ---------------------------------------------------------------------------
# groundx-storageclass
# Must match billing-workloads (aws-compatible-storage.storage.data.storageClass, groundx.cluster.pvClass).
# Set enabled=false if the storageclass already exists on the cluster.
# Override provisioner/parameters for non-AWS clusters (default is EBS).
# ---------------------------------------------------------------------------
groundx-storageclass:
  enabled: true
  storageClassName: groundx-pv
  # Do not modify cluster-wide default StorageClass
  isDefaultClass: false

# ---------------------------------------------------------------------------
# db-operator  (alias for percona/pxc-operator)
# mirrors: values/values.percona.operator.yaml
# Set enabled=false if Percona operator is already installed (e.g. via OLM)
# ---------------------------------------------------------------------------
db-operator:
  enabled: true
  nameOverride: db-operator
  nodeSelector:
    node: groundx-node

# ---------------------------------------------------------------------------
# stream-operator  (alias for strimzi-kafka-operator)
# mirrors: values/values.strimzi.operator.yaml
# Set enabled=false if Strimzi is already installed (e.g. via OLM)
# ---------------------------------------------------------------------------
stream-operator:
  enabled: false  # AMQ Streams (Strimzi) already installed via OLM on this cluster
  nodeSelector:
    node: groundx-node
  replicas: 1
