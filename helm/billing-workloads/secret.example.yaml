# Copy this file to secret.yaml and fill in your credentials.
# secret.yaml is gitignored — never commit real secrets.

# ---------------------------------------------------------------------------
# db-cluster  (Percona MySQL)
# ---------------------------------------------------------------------------
db-cluster:
  secrets:
    passwords:
      root: password
      xtrabackup: password
      monitor: password
      clustercheck: password
      proxyadmin: password
      operator: password
      replication: password

# ---------------------------------------------------------------------------
# aws-compatible-storage  (S3 credentials + UI auth)
# Must match GROUNDX_ACCESS_KEY_ID / GROUNDX_SECRET_ACCESS_KEY below.
# Creates Secret s4-credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
# when fullnameOverride: s4.
# ---------------------------------------------------------------------------
aws-compatible-storage:
  s3:
    accessKeyId: s4admin
    secretAccessKey: s4secret
  auth:
    username: admin
    password: changeme

# ---------------------------------------------------------------------------
# groundx-secret  (Kubernetes Secret consumed by GroundX and the notebook)
#
# Two different API keys — do not confuse them:
#
#   IMPORTANT: GROUNDX_ADMIN_API_KEY can be ANY UUID you choose.
#   It does not come from GroundX or another provider. Example:
#   "00000000-0000-0000-0000-000000000001". Used by the Streamlit UI
#   (and notebook client).
#
#   GROUNDX_AGENT_API_KEY  → OpenAI (or compatible) API key. Used by
#                            GroundX layout/extract agents when calling the
#                            LLM (groundx.extract.agent.serviceType: openai).
#                            This one MUST be a real API key.
# ---------------------------------------------------------------------------
groundx-secret:
  data:
    GROUNDX_ADMIN_EMAIL: support@myco.net
    # IMPORTANT: any UUID you choose — not an externally issued key
    GROUNDX_ADMIN_API_KEY: <any uuid> # e.g. "00000000-0000-0000-0000-000000000001"
    GROUNDX_ADMIN_PASSWORD: password
    GROUNDX_ADMIN_USERNAME: "00000000-0000-0000-0000-000000000000"
    GROUNDX_AGENT_API_KEY: sk-CHANGE_ME # OpenAI API key for agents
    GROUNDX_LICENSE_KEY: "00000000-0000-0000-0000-000000000002"
    # S4 S3 credentials (must match aws-compatible-storage.s3.* and groundx.file.* below)
    GROUNDX_ACCESS_KEY_ID: s4admin
    GROUNDX_SECRET_ACCESS_KEY: s4secret
    # Do NOT set AWS_* here — GroundX mounts this Secret into every pod.
    # AWS SDKs then probe EC2 instance metadata and hang (health timeouts /
    # CrashLoopBackOff). Use GROUNDX_* + groundx.file.username/password instead.
    MYSQL_INIT_PASSWORD: password
    MYSQL_INIT_USER: root
    MYSQL_USER: eyelevel
    MYSQL_PASSWORD: password

# ---------------------------------------------------------------------------
# groundx
# admin.apiKey must match GROUNDX_ADMIN_API_KEY (baked into extract/layout configs).
# summary.existing.apiKey MUST match GROUNDX_AGENT_API_KEY (real OpenAI key).
# If omitted, GroundX falls back to admin.apiKey and OpenAI returns 401.
# file.username / file.password must match aws-compatible-storage.s3.* (and GROUNDX_ACCESS_*).
# ---------------------------------------------------------------------------
groundx:
  licenseKey: "00000000-0000-0000-0000-000000000000"
  admin:
    apiKey: "00000000-0000-0000-0000-000000000001"  # same UUID as GROUNDX_ADMIN_API_KEY
    username: "00000000-0000-0000-0000-000000000000"
  summary:
    existing:
      apiKey: sk-CHANGE_ME  # same value as GROUNDX_AGENT_API_KEY above
  file:
    username: s4admin
    password: s4secret

# ---------------------------------------------------------------------------
# notebook  (optional overrides for the OpenShift AI data connection)
# Defaults to aws-compatible-storage.s3.* above — only set these to diverge.
# ---------------------------------------------------------------------------
# notebook:
#   s4:
#     accessKey: "s4admin"
#     secretKey: "s4secret"

# ---------------------------------------------------------------------------
# llm-service  (optional — only needed for gated Hugging Face models)
# Set llm-service.enabled: true in values.yaml to deploy.
# ---------------------------------------------------------------------------
llm-service:
  secret:
    hf_token: ""
