apiVersion: v2
name: billing-workloads
description: "Phase 2: Cluster instances, secrets, and GroundX for billing extraction. Includes an optional post-install Job (notebook.gitClone) that clones the quickstart repo into the workbench PVC when the OpenShift AI notebook is enabled."
version: 0.1.0
appVersion: "1.0.0"
type: application

dependencies:
  # percona/pxc-db  (release alias: db-cluster)
  - name: pxc-db
    alias: db-cluster
    repository: https://percona.github.io/percona-helm-charts/
    version: "*"

  # Shared aws-compatible-storage chart (S4-backed) from ai-architecture-charts.
  # fullnameOverride: s4 → short DNS http://s4:7480 / Secret s4-credentials.
  # Source: https://github.com/rh-ai-quickstart/ai-architecture-charts/tree/main/aws-compatible-storage
  # After publish, prefer: repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
  - name: aws-compatible-storage
    version: 0.1.0
    repository: "https://rh-ai-quickstart.github.io/ai-architecture-charts"
    condition: aws-compatible-storage.enabled

  # groundx/groundx-strimzi-kafka-cluster  (release alias: stream-cluster)
  - name: groundx-strimzi-kafka-cluster
    alias: stream-cluster
    repository: https://registry.groundx.ai/helm
    version: "*"

  # groundx/groundx-secret
  - name: groundx-secret
    repository: https://registry.groundx.ai/helm
    version: "*"

  # groundx/groundx
  - name: groundx
    repository: https://registry.groundx.ai/helm
    version: "*"

  # LLM service (vLLM) for deploying models e.g. google/gemma-3-12b-it
  - name: llm-service
    version: "0.5.2"
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: llm-service.enabled
