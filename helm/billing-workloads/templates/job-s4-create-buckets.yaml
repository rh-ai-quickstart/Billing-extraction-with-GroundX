{{- if and (index .Values "aws-compatible-storage" "enabled") .Values.awsCompatibleStorageBuckets.create }}
{{/*
Create GroundX / notebook buckets on aws-compatible-storage (S4).
Regular Job (not a Helm hook) so it runs with the release — same pattern as
Fraud-Detection. Uses UBI Python + boto3 (not quay.io/minio/mc).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "billing-workloads.fullname" . }}-s4-create-buckets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "billing-workloads.labels" . | nindent 4 }}
    app.kubernetes.io/component: s4-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "billing-workloads.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: s4-bootstrap
    spec:
      restartPolicy: OnFailure
      {{- with (index .Values "aws-compatible-storage" "nodeSelector") }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-s4
          image: {{ .Values.jobImages.cli | default "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest" }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Waiting for S4 UI at http://{{ include "s4.fullname" . }}:{{ include "s4.uiPort" . }}/api ..."
              i=0
              until curl -sf "http://{{ include "s4.fullname" . }}:{{ include "s4.uiPort" . }}/api" >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then
                  echo "Timed out waiting for S4"
                  exit 1
                fi
                echo -n "."
                sleep 5
              done
              echo " S4 is ready."
              sleep 5
      containers:
        - name: create-buckets
          image: {{ .Values.jobImages.python | default "registry.redhat.io/ubi9/python-311:latest" }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.awsCompatibleStorageBuckets.region | default "us-east-1" | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "s4.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "s4.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: S4_ENDPOINT
              value: {{ printf "http://%s:%s" (include "s4.fullname" .) (include "s4.apiPort" .) | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              echo "Installing boto3..."
              pip install --no-cache-dir -q boto3
              echo "Creating buckets on ${S4_ENDPOINT}..."
              python3 << 'EOF'
              import os, sys, time
              import boto3
              from botocore.client import Config

              endpoint = os.environ["S4_ENDPOINT"]
              buckets = {{ .Values.awsCompatibleStorageBuckets.names | default (list "eyelevel" "billing-artifacts") | toJson }}
              s3 = boto3.client(
                  "s3",
                  endpoint_url=endpoint,
                  aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
                  aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
                  region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-1"),
                  config=Config(s3={"addressing_style": "path"}),
              )
              existing = None
              last_err = None
              for attempt in range(1, 13):
                  try:
                      existing = {b["Name"] for b in s3.list_buckets().get("Buckets", [])}
                      break
                  except Exception as e:
                      last_err = e
                      print(f"list_buckets attempt {attempt}/12 failed: {e}", flush=True)
                      time.sleep(5)
              if existing is None:
                  print(f"Error: S3 API not ready after retries: {last_err}", file=sys.stderr)
                  sys.exit(1)
              try:
                  for bucket in buckets:
                      if bucket in existing:
                          print(f"Bucket {bucket} already exists")
                      else:
                          print(f"Creating bucket {bucket}...")
                          s3.create_bucket(Bucket=bucket)
                          print(f"Created {bucket}")
                  print("S4 bucket bootstrap complete.")
                  for b in s3.list_buckets().get("Buckets", []):
                      print(f"  - {b['Name']}")
              except Exception as e:
                  print(f"Error: {e}", file=sys.stderr)
                  sys.exit(1)
              EOF
{{- end }}
