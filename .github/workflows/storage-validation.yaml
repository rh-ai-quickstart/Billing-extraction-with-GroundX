name: Storage validation

on:
  pull_request:
    paths:
      - helm/**
      - .github/workflows/storage-validation.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.1
      - name: Install test and chart dependencies
        run: |
          python -m pip install boto3==1.40.48 PyYAML==6.0.2
          make -C helm dependencies
      - name: Lint charts
        run: |
          helm lint helm/billing-operators
          helm lint helm/billing-workloads -f helm/billing-workloads/secret.example.yaml
      - name: Start disposable S4
        run: |
          docker run --detach --name s4-test \
            --publish 127.0.0.1:7480:7480 --publish 127.0.0.1:5000:5000 \
            quay.io/rh-aiservices-bu/s4:0.3.2@sha256:48d1875da2eb087f6b52e01f3e97daa750962a347132230c27d35878c48ce16f
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:5000/api >/dev/null && \
               curl --silent --output /dev/null http://127.0.0.1:7480/; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' s4-test)" != true ]; then
              docker logs s4-test
              exit 1
            fi
            sleep 2
          done
          docker logs s4-test
          exit 1
      - name: Run storage tests against S4
        env:
          S4_TEST_ENDPOINT: http://127.0.0.1:7480
        run: python -m unittest discover -s helm/tests -v
      - name: S4 diagnostics
        if: failure()
        run: docker logs s4-test
      - name: Remove disposable S4
        if: always()
        run: docker rm --force s4-test
